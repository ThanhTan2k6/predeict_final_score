<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dự Đoán Điểm Final</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Dự Đoán Điểm</h2>
        <p style="font-size: 12px; color: green">● Đã nạp dataset TRAIN2</p>
        
        <div class="input-group">
            <label>Nhập điểm giữa kỳ:</label>
            <input type="number" id="midterm" placeholder="0.0 - 10.0" step="0.1">
        </div>
        
        <button id="predictBtn">Dự Đoán Ngay</button>
        
        <div id="res" class="result-box" style="display:none">
            <p>Dự đoán điểm cuối kỳ:</p>
            <h1 id="score">0.0</h1>
            <small id="formula"></small>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
